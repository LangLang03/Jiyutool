name: Build Tauri App

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'pnpm'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend deps
        run: npm ci

      # 关键步骤：根据事件类型设置构建参数
      - name: Set build variables
        id: vars
        run: |
          if [ "${{ github.event_name }}" == "schedule" ]; then
            echo "tag=nightly-${{ github.run_number }}" >> $GITHUB_OUTPUT
            echo "release=Nightly Build #${{ github.run_number }}" >> $GITHUB_OUTPUT
            echo "prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "release=App v${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "prerelease=false" >> $GITHUB_OUTPUT
          fi
        shell: bash

      - name: Build Tauri MSI
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ steps.vars.outputs.tag }}
          releaseName: ${{ steps.vars.outputs.release }}
          releaseDraft: true
          prerelease: ${{ steps.vars.outputs.prerelease == 'true' }}
          args: --target x86_64-pc-windows-msvc
